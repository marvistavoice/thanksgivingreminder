<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WRN Thanksgiving Textbank</title><style>body{font:16px system-ui,sans-serif;background:#f3f3ef;color:#222;margin:0}main{max-width:650px;margin:24px auto;padding:24px;background:white;border-radius:12px}label{display:block;font-weight:600;margin-top:16px}input,select,textarea,button,a{font:inherit;box-sizing:border-box}input,select,textarea{width:100%;padding:12px;border:1px solid #aaa;border-radius:6px;margin-top:6px}textarea{min-height:290px}button,a.button{display:block;width:100%;padding:12px;margin-top:10px;border:1px solid #222;border-radius:6px;background:white;color:#222;text-align:center;text-decoration:none;cursor:pointer}button.primary{background:#222;color:white}small{color:#555}</style></head><body><main><h1>WRN Thanksgiving Textbank</h1><p>Confirm attendance for Sunday, November 22, 2026.</p><label for="texter">Your name</label><input id="texter" autocomplete="given-name"><label for="vendor">Vendor's name</label><input id="vendor"><label for="count">Total attendees (including vendor)</label><input id="count" type="number" min="1" value="1"><label for="lang">Language</label><select id="lang"><option value="es">Español</option><option value="en">English</option></select><label for="message">Text message</label><textarea id="message"></textarea><button class="primary" id="copy">Copy text message</button><a class="button" href="https://canva.link/f0zsi3usbjsgakk" target="_blank" rel="noopener">Open event flyer</a><button id="next">Next vendor</button><p id="status" role="status"></p><small>Send the personalized message and flyer. Record the confirmed number of attendees or whether the vendor cannot attend. Next vendor keeps your name.</small></main><script>
const $=id=>document.getElementById(id);
function update(){const t=$('texter').value.trim(),v=$('vendor').value.trim(),n=Math.max(1,parseInt($('count').value)||1);$('message').value=$('lang').value==='es'?`Hola ${v||'[nombre del vendedor]'}, me llamo ${t||'[tu nombre]'} y soy parte de Westside Resource Network. Me estoy comunicando con usted para confirmar su asistencia${n>1?` y la de su familia (${n} personas en total)`:''} a nuestra celebración de este domingo, 22 de noviembre, a las 4:00 p. m.\n\nEl evento tendrá lugar en la iglesia luterana St. Andrew's, ubicada en 11555 National Blvd, Los Angeles, CA 90064.\n\nPor favor, confírmeme si ${n>1?'podrán asistir todos':'podrá asistir'}.\n\n¡Muchas gracias! ¡Esperamos verle allí!`:`Hi ${v||"[vendor's name]"}, my name is ${t||'[your name]'} and I'm with Westside Resource Network. I'm reaching out to confirm attendance for ${n>1?`you and your family (${n} people total)`:'you'} at our celebration this Sunday, November 22, at 4:00 PM.\n\nThe event will be held at St. Andrew's Lutheran Church at 11555 National Blvd, Los Angeles, CA 90064.\n\nPlease let us know if ${n>1?'everyone in your family will be able to attend':'you will be able to attend'}.\n\nThank you! We hope to see you there!`; $('status').textContent='';}
for(const id of ['texter','vendor','count','lang'])$(id).addEventListener('input',update);
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('message').value);$('status').textContent='Copied!';}catch{$('message').select();$('status').textContent='Select and copy the message manually.';}};
$('next').onclick=()=>{$('vendor').value='';$('count').value='1';update();$('vendor').focus();};update();
</script></body></html>
